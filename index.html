<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Magic Keys</title>
    <meta name="description" content="A playful piano where magic fingers play real songs while you press any key." />
    <meta name="theme-color" content="#87D0FB" />

    <!-- App icon: the flat blue grand piano (favicon on desktop, home-screen icon on mobile) -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/piano-icon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%icons/piano-icon-16.png?v=3" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%icons/piano-icon-64.png?v=3" />
    <link rel="icon" href="%BASE_URL%piano-icon.ico?v=3" sizes="48x48" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Magic Keys" />

    <!--
      Fonts: Resoomie Sans (OFL, /fonts/OFL.txt), served from this site only.
      Preloading starts the downloads together with the page, and the font rules
      live here (not in the JS bundle) so they exist before anything is drawn.
      The app stays hidden until the fonts are in (see main.ts), so a reload never
      flashes a backup font and then jumps.
    -->
    <link rel="preload" href="%BASE_URL%fonts/ResoomieSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/ResoomieSans-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/ResoomieSans-Semibold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%sheet-previews/fur-elise.svg" as="image" type="image/svg+xml" />
    <style>
      @font-face { font-family: 'Resoomie Sans'; font-weight: 400; font-display: block; src: url('%BASE_URL%fonts/ResoomieSans-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Resoomie Sans'; font-weight: 500; font-display: block; src: url('%BASE_URL%fonts/ResoomieSans-Medium.woff2') format('woff2'); }
      @font-face { font-family: 'Resoomie Sans'; font-weight: 600; font-display: block; src: url('%BASE_URL%fonts/ResoomieSans-Semibold.woff2') format('woff2'); }
      html, body { margin: 0; background: #fff; }
      /* Hidden until fonts are ready; main.ts adds .is-ready (a timeout guarantees it always appears). */
      #app { opacity: 0; }
      #app.is-ready { opacity: 1; transition: opacity 120ms ease-out; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
